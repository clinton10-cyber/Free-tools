<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Counter — Clinton Tech Tools</title>
<script>
(function () {
  try {
    var s = localStorage.getItem('ctt-theme');
    var t = s || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
:root { color-scheme: light; --paper:#F4F2ED; --surface:#FBFAF7; --ink:#101014; --ink-2:#4C4C55; --ink-3:#8B8B94; --line:#DFDCD4; --accent:#DE4416; }
html[data-theme="dark"] { color-scheme: dark; --paper:#0A0A0C; --surface:#121215; --ink:#F3F2EE; --ink-2:#A3A3AD; --ink-3:#6B6B76; --line:#232329; --accent:#FF5C2B; }
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); line-height:1.6;
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 64px; }
.back { display:inline-block; margin-bottom:32px; color:var(--ink-3); text-decoration:none; font-size:.875rem; }
.back:hover { color:var(--ink); }
h1 { margin:0 0 6px; font-size:2rem; letter-spacing:-.03em; }
p.lede { margin:0 0 24px; color:var(--ink-2); }
textarea { width:100%; min-height:240px; padding:16px; resize:vertical; font:inherit; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:12px; }
textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-top:16px; }
.stat { padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.stat b { display:block; font:500 1.4rem ui-monospace, Menlo, Consolas, monospace; }
.stat span { font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">&larr; Back to the library</a>
  <h1>Word Counter</h1>
  <p class="lede">Paste or type below. Nothing leaves your browser.</p>
  <textarea id="t" placeholder="Start typing…" aria-label="Text to count"></textarea>
  <div class="stats">
    <div class="stat"><b id="w">0</b><span>Words</span></div>
    <div class="stat"><b id="c">0</b><span>Characters</span></div>
    <div class="stat"><b id="n">0</b><span>No spaces</span></div>
    <div class="stat"><b id="s">0</b><span>Sentences</span></div>
    <div class="stat"><b id="r">0 min</b><span>Reading time</span></div>
  </div>
</div>
<script>
(function () {
  var t = document.getElementById('t');
  function set(id, v) { document.getElementById(id).textContent = v; }
  t.addEventListener('input', function () {
    var v = t.value, words = (v.trim().match(/\S+/g) || []).length;
    set('w', words);
    set('c', v.length);
    set('n', v.replace(/\s/g, '').length);
    set('s', (v.match(/[^.!?]+[.!?]+/g) || []).length);
    set('r', words ? Math.max(1, Math.round(words / 230)) + ' min' : '0 min');
  });
})();
</script>
</body>
</html>
